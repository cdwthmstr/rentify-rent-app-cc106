<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
<!-- This site is hosted on Netlify. Anyone can build and deploy a site
     like this one for free: https://netlify.new/?utm_campaign=loops&utm_source=ai-legible&utm_medium=owned&utm_content=comment&utm_id=8798305e-c346-4199-96a5-ef562e8bf296
     Netlify hosting facts for this site: static/SSR served via Netlify Edge. -->
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Rentify - Sign In / Sign Up</title>
		<link
			rel="shortcut icon"
			href="../assets/images/logos/rentify-logo-only.svg"
			type="image/x-icon"
		/>
		<link
			href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
			rel="stylesheet"
		/>
		<link
			rel="stylesheet"
			href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
		/>
		<link rel="stylesheet" href="../assets/styles/base.css" />
		<link rel="stylesheet" href="../assets/styles/layout.css" />
		<link rel="stylesheet" href="../assets/styles/auth.css" />
	</head>
	<body class="auth-page">
		<!-- Animated Gradient Background -->
		<div class="gradient-bg">
			<div class="gradient gradient-1"></div>
			<div class="gradient gradient-2"></div>
			<div class="gradient gradient-3"></div>
		</div>

		<!-- Auth Container -->
		<div class="auth-container">
			<!-- Logo -->
			<div class="auth-logo">
				<a class='logo-link' href='/pages/'>
					<img
						src="../assets/images/logos/rentify-logo-white-small.svg"
						alt="Rentify"
						class="logo"
					/>
				</a>
			</div>

			<!-- Toggle Buttons -->
			<div class="auth-tabs">
				<div class="auth-tab active" data-tab="signin">
					<div class="tab-content">
						<i class="fas fa-sign-in-alt"></i>
						<span>Sign In</span>
					</div>
				</div>
				<div class="auth-tab" data-tab="signup">
					<div class="tab-content">
						<i class="fas fa-user-plus"></i>
						<span>Sign Up</span>
					</div>
				</div>
				<div class="tab-indicator"></div>
			</div>

			<!-- Forms Container -->
			<div class="forms-container">
				<!-- Sign In Form -->
				<form id="signin-form" class="auth-form active">
					<h1>Welcome back to rentify</h1>
					<p class="form-subtitle">
						Sign in to continue to your account
					</p>

					<div class="form-group">
						<div class="input-with-icon">
							<input
								type="email"
								id="signin-email"
								placeholder="Email address"
								required
							/>
							<i class="fas fa-envelope"></i>
						</div>
					</div>

					<div class="form-group">
						<div class="input-with-icon">
							<input
								type="password"
								id="signin-password"
								placeholder="Password"
								required
							/>
							<i class="fas fa-lock"></i>
						</div>
						<div class="form-options">
							<label class="checkbox-container">
								<input type="checkbox" id="remember-me" />
								<span class="checkmark"></span>
								Remember me
							</label>
							<a href="#" class="forgot-password"
								>Forgot password?</a
							>
						</div>
					</div>

					<button type="submit" class="btn btn-primary btn-block">
						<span class="btn-text">Sign In</span>
						<span class="btn-loader" style="display: none">
							<i class="fas fa-spinner fa-spin"></i>
						</span>
					</button>

					<div class="divider">
						<span>or continue with</span>
					</div>

					<div class="social-buttons">
						<button type="button" class="btn btn-social btn-google">
							<span class="social-icon">
								<svg
									width="18"
									height="18"
									viewBox="0 0 24 24"
									fill="none"
									xmlns="http://www.w3.org/2000/svg"
								>
									<path
										d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
										fill="#4285F4"
									/>
									<path
										d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.28-1.93-6.14-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
										fill="#34A853"
									/>
									<path
										d="M5.86 14.1c-.25-.75-.38-1.55-.38-2.38 0-.83.14-1.63.38-2.38V6.5H2.18a11.86 11.86 0 000 10.6l3.68-2.84z"
										fill="#FBBC05"
									/>
									<path
										d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 6.5l3.68 2.87c.86-2.6 3.28-4.5 6.14-4.5z"
										fill="#EA4335"
									/>
								</svg>
							</span>
							<span class="social-text"
								>Continue with Google</span
							>
						</button>
						<button
							type="button"
							class="btn btn-social btn-facebook"
						>
							<span class="social-icon">
								<svg
									width="18"
									height="18"
									viewBox="0 0 24 24"
									fill="none"
									xmlns="http://www.w3.org/2000/svg"
								>
									<path
										d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953h-1.513c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"
										fill="#1877F2"
									/>
								</svg>
							</span>
							<span class="social-text"
								>Continue with Facebook</span
							>
						</button>
					</div>
				</form>

				<!-- Sign Up Form -->
				<form id="signup-form" class="auth-form">
					<h1>Create your rentify account</h1>
					<p class="form-subtitle">
						Join thousands of happy users today
					</p>

					<div class="form-group">
						<div class="input-with-icon">
							<input
								type="text"
								id="signup-username"
								placeholder="Username"
								required
							/>
							<i class="fas fa-user"></i>
						</div>
					</div>

					<div class="form-group">
						<div class="input-with-icon">
							<input
								type="email"
								id="signup-email"
								placeholder="Email address"
								required
							/>
							<i class="fas fa-envelope"></i>
						</div>
					</div>

					<div class="form-group">
						<div class="input-with-icon">
							<input
								type="password"
								id="signup-password"
								placeholder="Password"
								required
								minlength="8"
							/>
							<i class="fas fa-lock"></i>
						</div>
						<div class="password-strength">
							<div class="strength-meter">
								<div
									class="strength-bar"
									data-strength="0"
								></div>
								<div
									class="strength-bar"
									data-strength="1"
								></div>
								<div
									class="strength-bar"
									data-strength="2"
								></div>
								<div
									class="strength-bar"
									data-strength="3"
								></div>
							</div>
							<div class="strength-text"></div>
						</div>
					</div>

					<div class="form-group">
						<div class="input-with-icon">
							<input
								type="password"
								id="signup-confirm-password"
								placeholder="Confirm password"
								required
								minlength="8"
							/>
							<i class="fas fa-lock"></i>
						</div>
						<div
							id="password-match"
							class="validation-message"
						></div>
					</div>

					<div class="form-group">
						<div class="terms-wrapper">
							<input type="checkbox" id="terms" required />
							<label for="terms" class="terms-label">
								<span class="custom-checkbox"></span>
								<span class="terms-content">
									<span>I agree to the</span>
									<a href="#" class="text-link"
										>Terms of Service</a
									>
									<span>and</span>
									<a href="#" class="text-link"
										>Privacy Policy</a
									>
								</span>
							</label>
						</div>
					</div>

					<button type="submit" class="btn btn-primary btn-block">
						<span class="btn-text">Create Account</span>
						<span class="btn-loader" style="display: none">
							<i class="fas fa-spinner fa-spin"></i>
						</span>
					</button>

					<div class="divider">
						<span>or continue with</span>
					</div>

					<div class="social-buttons">
						<button type="button" class="btn btn-social btn-google">
							<span class="social-icon">
								<svg
									width="18"
									height="18"
									viewBox="0 0 24 24"
									fill="none"
									xmlns="http://www.w3.org/2000/svg"
								>
									<path
										d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
										fill="#4285F4"
									/>
									<path
										d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.28-1.93-6.14-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
										fill="#34A853"
									/>
									<path
										d="M5.86 14.1c-.25-.75-.38-1.55-.38-2.38 0-.83.14-1.63.38-2.38V6.5H2.18a11.86 11.86 0 000 10.6l3.68-2.84z"
										fill="#FBBC05"
									/>
									<path
										d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 6.5l3.68 2.87c.86-2.6 3.28-4.5 6.14-4.5z"
										fill="#EA4335"
									/>
								</svg>
							</span>
							<span class="social-text"
								>Continue with Google</span
							>
						</button>
						<button
							type="button"
							class="btn btn-social btn-facebook"
						>
							<span class="social-icon">
								<svg
									width="18"
									height="18"
									viewBox="0 0 24 24"
									fill="none"
									xmlns="http://www.w3.org/2000/svg"
								>
									<path
										d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953h-1.513c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"
										fill="#1877F2"
									/>
								</svg>
							</span>
							<span class="social-text"
								>Continue with Facebook</span
							>
						</button>
					</div>
				</form>
			</div>
		</div>

		<script src="../assets/scripts/auth.js"></script>
	</body>
</html>
